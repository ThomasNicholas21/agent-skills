[project]
name = "agent-skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ThomasNicholas21", email = "thomasnicholaas@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "fastmcp>=4.1.4",
    "google-genai>=2.33.0",
    "grandalf>=0.8",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "pillow>=13.0.0",
]

[project.scripts]
agent-skills = "agent_skills:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
